spark.master                     yarn
spark.submit.deployMode          client
spark.driver.host                masternode

# Spark History Server (Cau 6: xem DAG, stage, thoi gian, I/O de so voi MapReduce)
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://masternode:9000/spark-logs
spark.history.fs.logDirectory    hdfs://masternode:9000/spark-logs
spark.history.provider           org.apache.spark.deploy.history.FsHistoryProvider
spark.history.ui.port            18080

# Tai nguyen (vua cum 3 NodeManager x 2,5 GB)
spark.driver.memory              1g
spark.executor.memory            1g
spark.executor.cores             1
spark.executor.instances         2
spark.yarn.am.memory             512m
spark.sql.shuffle.partitions     12

# Cac jar cua Spark da nam san tren HDFS -> submit nhanh hon
spark.yarn.archive               hdfs://masternode:9000/spark-libs/spark-libs.jar
spark.pyspark.python             python3
