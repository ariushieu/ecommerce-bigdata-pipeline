# =============================================================================
#  Cau 2 - Thi nghiem sap agent: FileChannel giu duoc su kien, MemoryChannel mat.
#  Hai agent trong cung mot file, DUNG CHUNG thu muc FileChannel:
#    c0 : HTTP -> (fcCrash, mcCrash), CHUA co sink -> su kien nam cho trong channel
#         -> crash_demo.sh gui 1.000 su kien roi kill -9 (gia lap mat dien)
#    c1 : cung source/channel, them 2 sink HDFS: fcCrash -> fc/, mcCrash -> mc/
#         -> khoi dong lai, dem so su kien moi channel con giao duoc
#  Chi dung duong dan tam (crash_demo.sh thay /tmp/cau02_crash bang thu muc rieng).
# =============================================================================
c0.sources  = httpSrc
c0.channels = fcCrash mcCrash
c0.sources.httpSrc.type = http
c0.sources.httpSrc.bind = 0.0.0.0
c0.sources.httpSrc.port = 41497
c0.sources.httpSrc.handler = org.apache.flume.source.http.JSONHandler
c0.sources.httpSrc.channels = fcCrash mcCrash
c0.channels.fcCrash.type = file
c0.channels.fcCrash.checkpointDir = /tmp/cau02_crash/fc/checkpoint
c0.channels.fcCrash.dataDirs = /tmp/cau02_crash/fc/data
c0.channels.fcCrash.capacity = 100000
c0.channels.fcCrash.transactionCapacity = 1000
c0.channels.mcCrash.type = memory
c0.channels.mcCrash.capacity = 100000
c0.channels.mcCrash.transactionCapacity = 1000

c1.sources  = httpSrc
c1.channels = fcCrash mcCrash
c1.sinks    = fcOut mcOut
c1.sources.httpSrc.type = http
c1.sources.httpSrc.bind = 0.0.0.0
c1.sources.httpSrc.port = 41497
c1.sources.httpSrc.handler = org.apache.flume.source.http.JSONHandler
c1.sources.httpSrc.channels = fcCrash mcCrash
c1.channels.fcCrash.type = file
c1.channels.fcCrash.checkpointDir = /tmp/cau02_crash/fc/checkpoint
c1.channels.fcCrash.dataDirs = /tmp/cau02_crash/fc/data
c1.channels.fcCrash.capacity = 100000
c1.channels.fcCrash.transactionCapacity = 1000
c1.channels.mcCrash.type = memory
c1.channels.mcCrash.capacity = 100000
c1.channels.mcCrash.transactionCapacity = 1000

c1.sinks.fcOut.type = hdfs
c1.sinks.fcOut.channel = fcCrash
c1.sinks.fcOut.hdfs.path = hdfs://masternode:9000/tmp/cau02_crash/fc
c1.sinks.fcOut.hdfs.filePrefix = events
c1.sinks.fcOut.hdfs.inUsePrefix = _
c1.sinks.fcOut.hdfs.fileType = DataStream
c1.sinks.fcOut.hdfs.rollInterval = 0
c1.sinks.fcOut.hdfs.rollSize = 0
c1.sinks.fcOut.hdfs.rollCount = 0
c1.sinks.fcOut.hdfs.idleTimeout = 5
c1.sinks.fcOut.hdfs.batchSize = 500

c1.sinks.mcOut.type = hdfs
c1.sinks.mcOut.channel = mcCrash
c1.sinks.mcOut.hdfs.path = hdfs://masternode:9000/tmp/cau02_crash/mc
c1.sinks.mcOut.hdfs.filePrefix = events
c1.sinks.mcOut.hdfs.inUsePrefix = _
c1.sinks.mcOut.hdfs.fileType = DataStream
c1.sinks.mcOut.hdfs.rollInterval = 0
c1.sinks.mcOut.hdfs.rollSize = 0
c1.sinks.mcOut.hdfs.rollCount = 0
c1.sinks.mcOut.hdfs.idleTimeout = 5
c1.sinks.mcOut.hdfs.batchSize = 500
