# =============================================================================
#  Cau 2 - Kich ban (i): nap tep CSV theo lo vao HDFS raw
#
#    spooldir (orders | customers | products)  ->  FileChannel  ->  HDFS sink
#
#  - Moi bang mot thu muc spool tren o cuc bo cua masternode. Tep dat vao spool
#    phai la tep DA GHI XONG va TEN KHONG LAP LAI (run_batch.sh chep vao ten tam
#    *.tmp roi mv cho nguyen tu).
#  - Interceptor static gan header table=<bang>; header basename = ten tep lo.
#  - HDFS sink ghi /btl/raw/<bang>/ingest_date=<ngay nap>/<ten lo>.<so dem>.csv:
#    moi tep lo -> mot tep HDFS rieng (bucket theo %{basename}), giu nguyen tung
#    byte (con BOM, con dong tieu de, con CRLF) dung quy uoc vung raw.
#  - Khong bao gio ghi vao partition ban chup ingest_date=2026-08-01.
#
#  Chay:  flume-ng agent -n b1 -c $FLUME_HOME/conf -f conf/batch-csv.conf
#  (run_batch.sh lo toan bo: tao thu muc, dat tep, cho xong, kiem tra, tat agent)
# =============================================================================
b1.sources  = srcOrders srcCustomers srcProducts
b1.channels = fcBatch
b1.sinks    = hdfsRaw

# --- Sources: spooling directory --------------------------------------------
b1.sources.srcOrders.type = spooldir
b1.sources.srcOrders.channels = fcBatch
b1.sources.srcOrders.spoolDir = /home/hadoop/flume-data/cau02/spool/orders
# moi dong CSV = 1 event; dong ~153 byte, nang gioi han len cho an toan
b1.sources.srcOrders.deserializer = LINE
b1.sources.srcOrders.deserializer.maxLineLength = 8192
b1.sources.srcOrders.inputCharset = UTF-8
# tep dang chep do (*.tmp) chua duoc doc
b1.sources.srcOrders.ignorePattern = ^.*[.]tmp$
# doc xong: doi ten thanh *.COMPLETED (khong xoa) -> lam bang chung, de nap lai
b1.sources.srcOrders.deletePolicy = never
b1.sources.srcOrders.basenameHeader = true
b1.sources.srcOrders.batchSize = 1000
b1.sources.srcOrders.interceptors = tbl
b1.sources.srcOrders.interceptors.tbl.type = static
b1.sources.srcOrders.interceptors.tbl.key = table
b1.sources.srcOrders.interceptors.tbl.value = orders

b1.sources.srcCustomers.type = spooldir
b1.sources.srcCustomers.channels = fcBatch
b1.sources.srcCustomers.spoolDir = /home/hadoop/flume-data/cau02/spool/customers
b1.sources.srcCustomers.deserializer = LINE
b1.sources.srcCustomers.deserializer.maxLineLength = 8192
b1.sources.srcCustomers.inputCharset = UTF-8
b1.sources.srcCustomers.ignorePattern = ^.*[.]tmp$
b1.sources.srcCustomers.deletePolicy = never
b1.sources.srcCustomers.basenameHeader = true
b1.sources.srcCustomers.batchSize = 1000
b1.sources.srcCustomers.interceptors = tbl
b1.sources.srcCustomers.interceptors.tbl.type = static
b1.sources.srcCustomers.interceptors.tbl.key = table
b1.sources.srcCustomers.interceptors.tbl.value = customers

b1.sources.srcProducts.type = spooldir
b1.sources.srcProducts.channels = fcBatch
b1.sources.srcProducts.spoolDir = /home/hadoop/flume-data/cau02/spool/products
b1.sources.srcProducts.deserializer = LINE
b1.sources.srcProducts.deserializer.maxLineLength = 8192
b1.sources.srcProducts.inputCharset = UTF-8
b1.sources.srcProducts.ignorePattern = ^.*[.]tmp$
b1.sources.srcProducts.deletePolicy = never
b1.sources.srcProducts.basenameHeader = true
b1.sources.srcProducts.batchSize = 1000
b1.sources.srcProducts.interceptors = tbl
b1.sources.srcProducts.interceptors.tbl.type = static
b1.sources.srcProducts.interceptors.tbl.key = table
b1.sources.srcProducts.interceptors.tbl.value = products

# --- Channel: FileChannel (ben vung, song sot khi agent/may khoi dong lai) --
b1.channels.fcBatch.type = file
b1.channels.fcBatch.checkpointDir = /home/hadoop/flume-data/cau02/fc-batch/checkpoint
b1.channels.fcBatch.backupCheckpointDir = /home/hadoop/flume-data/cau02/fc-batch/checkpoint-backup
b1.channels.fcBatch.useDualCheckpoints = true
b1.channels.fcBatch.dataDirs = /home/hadoop/flume-data/cau02/fc-batch/data
b1.channels.fcBatch.capacity = 1000000
b1.channels.fcBatch.transactionCapacity = 10000
b1.channels.fcBatch.checkpointInterval = 30000

# --- Sink: HDFS --------------------------------------------------------------
b1.sinks.hdfsRaw.type = hdfs
b1.sinks.hdfsRaw.channel = fcBatch
b1.sinks.hdfsRaw.hdfs.path = hdfs://masternode:9000/btl/raw/%{table}/ingest_date=%Y-%m-%d
b1.sinks.hdfsRaw.hdfs.useLocalTimeStamp = true
# ten tep = ten lo -> moi lo mot tep HDFS, truy vet duoc nguon goc
b1.sinks.hdfsRaw.hdfs.filePrefix = %{basename}
b1.sinks.hdfsRaw.hdfs.fileSuffix = .csv
# tep dang ghi: _<ten>.tmp -> Pig/MapReduce/Spark tu bo qua tep bat dau bang "_"
b1.sinks.hdfsRaw.hdfs.inUsePrefix = _
b1.sinks.hdfsRaw.hdfs.inUseSuffix = .tmp
# ghi nguyen van body + "\n" (khong SequenceFile)
b1.sinks.hdfsRaw.hdfs.fileType = DataStream
b1.sinks.hdfsRaw.hdfs.writeFormat = Text
# roll theo dung luong (127 MiB < block 128 MiB) hoac khi lo da im 30 s
b1.sinks.hdfsRaw.hdfs.rollSize = 133169152
b1.sinks.hdfsRaw.hdfs.rollCount = 0
b1.sinks.hdfsRaw.hdfs.rollInterval = 0
b1.sinks.hdfsRaw.hdfs.idleTimeout = 30
b1.sinks.hdfsRaw.hdfs.batchSize = 1000
b1.sinks.hdfsRaw.hdfs.callTimeout = 30000
b1.sinks.hdfsRaw.hdfs.maxOpenFiles = 50
